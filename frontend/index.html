<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon set -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Default SEO (overridden per route via useDocumentMeta) -->
    <title>Auryvex — Custom Software for Growing Businesses</title>
    <meta
      name="description"
      content="Auryvex builds custom web applications and internal tools for businesses that need software that works exactly the way they do."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — LAUNCH BLOCKER: update og:url and og:image once domain is confirmed -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Auryvex — Custom Software for Growing Businesses" />
    <meta
      property="og:description"
      content="Auryvex builds custom web applications and internal tools for businesses that need software that works exactly the way they do."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auryvex — Custom Software for Growing Businesses" />
    <meta
      name="twitter:description"
      content="Auryvex builds custom web applications and internal tools for businesses that need software that works exactly the way they do."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme colour matches the accent -->
    <meta name="theme-color" content="#4f46e5" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
